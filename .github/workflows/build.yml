name: Build Proton-CachyOS

# The run title is fixed when the run starts, so it can only use inputs - the
# exact build name comes from git describe at runtime. The resolved name is
# written to the job summary instead.
run-name: "Build Proton-CachyOS: ${{ inputs.branch }} · ${{ inputs.march }} · ${{ inputs.linuxuwu_patch && 'linuxuwu' || 'stock' }}${{ inputs.dxvk_latest && ' · dxvk-git' || '' }}${{ inputs.vkd3d_latest && ' · vkd3d-git' || '' }}${{ inputs.dry_run && ' · dry-run' || '' }}"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag of CachyOS/proton-cachyos to build (prefer a -slr release tag; dated branches get deleted)'
        required: true
        type: string
        default: 'cachyos-11.0-20260702-slr'
      march:
        description: 'CPU optimisation target'
        required: true
        type: choice
        default: 'zen4'
        options:
          - zen4
          - zen3
          - zen2
          - x86-64-v4
          - x86-64-v3
          - nocona
      linuxuwu_patch:
        description: 'Apply the CPUID, KUSER_SHARED_DATA, and faketime hardware patch'
        required: false
        type: boolean
        default: true
      dxvk_latest:
        description: 'Build DXVK from upstream master instead of the pinned submodule'
        required: false
        type: boolean
        default: false
      vkd3d_latest:
        description: 'Build vkd3d-proton from upstream master instead of the pinned submodule'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate only (checkout + patch + configure, no build)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: "${{ inputs.march }} · ${{ inputs.linuxuwu_patch && 'linuxuwu' || 'stock' }}${{ inputs.dxvk_latest && ' · dxvk-git' || '' }}${{ inputs.vkd3d_latest && ' · vkd3d-git' || '' }} @ ${{ inputs.branch }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # Serialise only identical builds. Different branch/march combinations are
    # independent and run concurrently, and they use separate ccache keys.
    # This lives on the job, not the workflow: the inputs context is not
    # available in workflow-level concurrency, and referencing it there makes
    # GitHub silently refuse to index the whole file.
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.branch }}-${{ inputs.march }}-${{ inputs.linuxuwu_patch }}-${{ inputs.dxvk_latest }}-${{ inputs.vkd3d_latest }}
      cancel-in-progress: false

    steps:
      # Stock runners have ~14 GB free; the checkout alone is ~11 GB.
      - name: Debloat GitHub runner
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: >-
            azure-cli
            google-cloud-cli
            microsoft-edge-stable
            google-chrome-stable
            firefox
            postgresql*
            temurin-*
            *llvm*
            mysql*
            dotnet-sdk-*
          remove_packages_one_command: false
          remove_folders: >-
            /usr/share/swift
            /usr/share/miniconda
            /usr/share/az*
            /usr/local/lib/node_modules
            /usr/local/share/chromium
            /usr/local/share/powershell
            /usr/local/julia
            /usr/local/aws-cli
            /usr/local/aws-sam-cli
            /usr/share/gradle
          testing: false

      - name: Prepare host
        run: sudo apt-get update && sudo apt-get install -y ccache fontforge-nox

      - name: Checkout overlay
        uses: actions/checkout@v6
        with:
          path: overlay

      - name: Checkout proton-cachyos
        uses: actions/checkout@v6
        with:
          repository: CachyOS/proton-cachyos
          ref: ${{ inputs.branch }}
          path: proton-cachyos
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      # A dated branch sits at its -base rebase anchor until CachyOS applies their
      # wine fork and feature stack. In that state wine still points at upstream's
      # relative ../wine (a 404) and the submodule fetch fails obscurely.
      - name: Check branch is a finalised release
        working-directory: proton-cachyos
        run: |
          desc=$(git describe --long --tags)
          echo "describe: $desc"
          case "$desc" in
            *-base-0-g*)
              echo "::error::${{ inputs.branch }} is still at its -base anchor ($desc) - CachyOS has not finished the rebase, so it cannot be built yet. Pick the previous dated branch."
              exit 1 ;;
          esac

      - name: Fetch submodules
        working-directory: proton-cachyos
        run: git submodule update --init --filter=tree:0 --recursive

      # Both submodules already point at upstream (doitsujin/dxvk,
      # HansKristian-Work/vkd3d-proton), so this is a plain fast-forward, not a
      # remote swap. master rather than the newest tag on purpose: vkd3d-proton's
      # latest tag is v3.0.1 while the pin sits 236 commits past it, so checking
      # out the tag would be a downgrade.
      #
      # --recursive is mandatory. dxvk pulls in dxbc-spirv and vkd3d-proton pulls
      # in dxil-spirv, both of which move with the bump and both of which have
      # submodules of their own; meson fails at configure on an empty subproject
      # dir and cannot fetch a wrap from inside the build container.
      - name: Bump graphics submodules to upstream master
        if: ${{ inputs.dxvk_latest || inputs.vkd3d_latest }}
        working-directory: proton-cachyos
        env:
          BUMP_DXVK: ${{ inputs.dxvk_latest }}
          BUMP_VKD3D: ${{ inputs.vkd3d_latest }}
        run: |
          bump() {
            echo "::group::bumping $1"
            git -C "$1" fetch --filter=tree:0 --tags origin master
            git -C "$1" checkout --detach FETCH_HEAD
            git -C "$1" submodule sync --recursive
            git -C "$1" submodule update --init --recursive --filter=tree:0
            echo "$1 now at: $(git -C "$1" describe --tags --always)"
            echo "::endgroup::"
          }
          if [ "$BUMP_DXVK" = "true" ]; then bump dxvk; fi
          if [ "$BUMP_VKD3D" = "true" ]; then bump vkd3d-proton; fi
          # proton-cachyos carries one out-of-tree DXVK patch (HDR detection) that
          # its Makefile applies during `make`, long after configure - so a dry_run
          # would not catch a conflict. Check it here instead, where it costs
          # seconds rather than an hour. vkd3d-proton has no patches at all.
          if [ "$BUMP_DXVK" = "true" ] && [ -d patches/dxvk ]; then
            for p in patches/dxvk/*.patch; do
              [ -e "$p" ] || continue
              echo "checking $p against bumped dxvk"
              patch -d dxvk -Np1 --dry-run -i "../$p" || {
                echo "::error::$(basename "$p") no longer applies to dxvk master. Regenerate it or leave dxvk_latest off."
                exit 1
              }
            done
          fi
          git --no-pager submodule status dxvk vkd3d-proton

      - name: Apply overlay patch
        working-directory: proton-cachyos
        env:
          APPLY_LINUXUWU: ${{ inputs.linuxuwu_patch }}
        run: |
          applied=0
          if [ "$APPLY_LINUXUWU" = "true" ]; then
            git apply --verbose --whitespace=nowarn ../overlay/linuxuwu.patch
            applied=1
          fi
          echo "linuxuwu patch applied: $applied"
          echo "PATCHES_APPLIED=$applied" >> "$GITHUB_ENV"
          git --no-pager diff --stat

      - name: Resolve build name and optimisation flags
        id: cfg
        working-directory: proton-cachyos
        run: |
          case "${{ inputs.march }}" in
            zen4)      cf="-O3 -march=znver4 -mtune=znver4" ;;
            zen3)      cf="-O3 -march=znver3 -mtune=znver3" ;;
            zen2)      cf="-O3 -march=znver2 -mtune=znver2" ;;
            x86-64-v4) cf="-O3 -march=x86-64-v4 -mtune=core-avx2" ;;
            x86-64-v3) cf="-O3 -march=x86-64-v3 -mtune=core-avx2" ;;
            nocona)    cf="-O3 -march=nocona -mtune=core-avx2" ;;
            *) echo "::error::unhandled march ${{ inputs.march }}"; exit 1 ;;
          esac
          # RUSTFLAGS target-cpu stays at nocona for every preset, exactly as upstream
          # does even for its x86-64-v3 build. The SteamRT SDK's rustc does not know
          # newer CPU names; an unrecognised -Ctarget-cpu silently falls back to a
          # subtarget that cannot emit 64-bit code, and gst-plugins-rs dies with
          # "LLVM ERROR: 64-bit code requested on a subtarget that doesn't support it".
          rc=nocona
          # Name: proton-<vendor>-<version>-<postfix>, e.g.
          #   proton-zi0p4tch0-11.0-20260702-slr-zen4
          # --tags without --long gives a bare tag name when the ref is exactly a tag
          # (the usual case), and tag-N-gsha only when it genuinely sits past one.
          # --long would append a meaningless -0-g<sha> to every tag build, and Steam's
          # Gamemode UI truncates long display names.
          base=$(git describe --tags | sed 's/^cachyos-/zi0p4tch0-/')
          # An unpatched, unbumped build is stock upstream source, so it only earns
          # the -<march> optimisation marker.
          features=""
          if [ "${PATCHES_APPLIED:-0}" -ne 0 ]; then
            features="${features}-linuxuwu"
          fi
          if [ "${{ inputs.dxvk_latest }}" = "true" ]; then
            features="${features}-dxvk-git"
          fi
          if [ "${{ inputs.vkd3d_latest }}" = "true" ]; then
            features="${features}-vkd3d-git"
          fi
          stock="proton-${base}"
          suffix="${features}-${{ inputs.march }}"
          mkdir -p ./build
          {
            echo "cflags=$cf"
            echo "rustflags=-Copt-level=3 -Ctarget-cpu=$rc"
            echo "build_name=${stock}${suffix}"
          } >> "$GITHUB_OUTPUT"
          echo "Build name: ${stock}${suffix}"
          {
            echo "### ${stock}${suffix}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`${{ inputs.branch }}\` |"
            echo "| march | \`${{ inputs.march }}\` |"
            echo "| cflags | \`$cf\` |"
            echo "| linuxuwu patch | ${{ inputs.linuxuwu_patch }} |"
            echo "| dxvk | \`$(git -C dxvk describe --tags --always)\` |"
            echo "| vkd3d-proton | \`$(git -C vkd3d-proton describe --tags --always)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure
        working-directory: proton-cachyos/build
        env:
          CFLAGS: ${{ steps.cfg.outputs.cflags }}
          RUSTFLAGS: ${{ steps.cfg.outputs.rustflags }}
          USE_LTO: 0
        run: |
          ../configure.sh \
            --build-name=${{ steps.cfg.outputs.build_name }} \
            --container-engine=docker \
            --enable-ccache
          cat Makefile

      - name: Cache identifier
        id: ccache-id
        working-directory: proton-cachyos/build
        run: |
          image=$(make get-steamrt-image | tail -1)
          # Keyed on the resolved submodule SHAs, not the input booleans: a bumped
          # build tracks a moving master, so yesterday's cache is for different
          # source. ccache is content-addressed anyway, this just stops pinned and
          # bumped builds evicting each other out of the 10 GB budget.
          gfx=$(git -C .. submodule status dxvk vkd3d-proton | awk '{print $1}' | tr -d '+-' | tr '\n' ' ')
          checksum=$(echo "$image ${{ steps.cfg.outputs.cflags }} $gfx" | sha1sum | cut -d' ' -f1)
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache-restore
        if: ${{ !inputs.dry_run }}
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-proton-${{ steps.ccache-id.outputs.checksum }}-${{ github.run_id }}
          restore-keys: |
            ccache-proton-${{ steps.ccache-id.outputs.checksum }}

      - name: Build
        if: ${{ !inputs.dry_run }}
        working-directory: proton-cachyos/build
        run: make redist

      - name: Save ccache
        if: ${{ !inputs.dry_run && always() }}
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      # GitHub always wraps artifacts in a zip, so the artifact is named without a
      # suffix: it downloads as <build_name>.zip containing the .tar.xz and its
      # checksum, rather than a doubled-up <build_name>.tar.xz.zip.
      - name: Upload build
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cfg.outputs.build_name }}
          path: |
            proton-cachyos/build/${{ steps.cfg.outputs.build_name }}.tar.xz
            proton-cachyos/build/${{ steps.cfg.outputs.build_name }}.sha512sum
          retention-days: 30
          if-no-files-found: error
