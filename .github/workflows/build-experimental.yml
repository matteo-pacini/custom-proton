name: Build Proton Experimental

run-name: 'Build Proton Experimental: ${{ inputs.ref }} · ${{ inputs.march }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit from ValveSoftware/Proton'
        required: true
        type: string
        default: 'experimental_11.0'
      march:
        description: 'CPU optimisation target'
        required: true
        type: choice
        default: 'zen4'
        options:
          - zen4
          - zen3
          - zen2
          - x86-64-v4
          - x86-64-v3
          - nocona
      hardware_patch:
        description: 'Apply the CPUID, KUSER_SHARED_DATA, and faketime hardware patch'
        required: false
        type: boolean
        default: true
      optiscaler_patches:
        description: 'Apply OptiScaler and all dependent protonfixes patches'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Validate checkout, patches, and configure without building'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: ${{ inputs.march }} @ ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.ref }}-${{ inputs.march }}-${{ inputs.hardware_patch }}-${{ inputs.optiscaler_patches }}
      cancel-in-progress: false

    steps:
      - name: Debloat GitHub runner
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: >-
            azure-cli
            google-cloud-cli
            microsoft-edge-stable
            google-chrome-stable
            firefox
            postgresql*
            temurin-*
            *llvm*
            mysql*
            dotnet-sdk-*
          remove_packages_one_command: false
          remove_folders: >-
            /usr/share/swift
            /usr/share/miniconda
            /usr/share/az*
            /usr/local/lib/node_modules
            /usr/local/share/chromium
            /usr/local/share/powershell
            /usr/local/julia
            /usr/local/aws-cli
            /usr/local/aws-sam-cli
            /usr/share/gradle
          testing: false

      - name: Prepare host
        run: sudo apt-get update && sudo apt-get install -y ccache fontforge-nox

      - name: Checkout overlay
        uses: actions/checkout@v6
        with:
          path: overlay

      - name: Checkout Proton Experimental
        uses: actions/checkout@v6
        with:
          repository: ValveSoftware/Proton
          ref: ${{ inputs.ref }}
          path: proton-experimental
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Fetch Proton submodules
        working-directory: proton-experimental
        run: git submodule update --init --filter=tree:0 --recursive

      - name: Checkout protonfixes
        if: ${{ inputs.optiscaler_patches }}
        uses: actions/checkout@v6
        with:
          repository: Open-Wine-Components/umu-protonfixes
          ref: c43c368d83120cc1bcc1f1df52c094f75af5744c
          path: proton-experimental/protonfixes
          submodules: recursive

      - name: Apply Experimental patches
        env:
          APPLY_HARDWARE: ${{ inputs.hardware_patch }}
          APPLY_OPTISCALER: ${{ inputs.optiscaler_patches }}
        run: |
          git -C proton-experimental apply --verbose --whitespace=nowarn \
            ../overlay/valve-experimental/001-build-flags.patch
          if [ "$APPLY_OPTISCALER" = "true" ]; then
            git -C proton-experimental apply --verbose --whitespace=nowarn \
              ../overlay/valve-experimental/002-optiscaler-integration.patch
            for p in overlay/valve-experimental/protonfixes/*.patch; do
              git -C proton-experimental/protonfixes apply --verbose --whitespace=nowarn "../../$p"
            done
            git -C proton-experimental/protonfixes diff --check
          fi
          if [ "$APPLY_HARDWARE" = "true" ]; then
            git -C proton-experimental/wine apply --verbose --whitespace=nowarn \
              ../../overlay/valve-experimental/wine/001-linuxuwu.patch
            git -C proton-experimental/wine diff --check
          fi
          git -C proton-experimental diff --check

      - name: Resolve build name and optimisation flags
        id: cfg
        working-directory: proton-experimental
        run: |
          case "${{ inputs.march }}" in
            zen4)      cf="-O3 -march=znver4 -mtune=znver4" ;;
            zen3)      cf="-O3 -march=znver3 -mtune=znver3" ;;
            zen2)      cf="-O3 -march=znver2 -mtune=znver2" ;;
            x86-64-v4) cf="-O3 -march=x86-64-v4 -mtune=core-avx2" ;;
            x86-64-v3) cf="-O3 -march=x86-64-v3 -mtune=core-avx2" ;;
            nocona)    cf="-O3 -march=nocona -mtune=core-avx2" ;;
            *) echo "::error::unhandled march ${{ inputs.march }}"; exit 1 ;;
          esac
          tag=$(git tag --points-at HEAD --list 'experimental-11.0-*' | sort | tail -1)
          version=${tag#experimental-}
          if [ -z "$version" ]; then
            version=$(git describe --tags --always)
          fi
          features=""
          if [ "${{ inputs.hardware_patch }}" = "true" ]; then
            features="${features}-linuxuwu"
          fi
          if [ "${{ inputs.optiscaler_patches }}" = "true" ]; then
            features="${features}-optiscaler"
          fi
          build_name="proton-zi0p4tch0-${version}-exp${features}-${{ inputs.march }}"
          mkdir -p build
          {
            echo "cflags=$cf"
            echo "build_name=$build_name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $build_name"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Valve ref | \`${{ inputs.ref }}\` |"
            echo "| Valve commit | \`$(git rev-parse HEAD)\` |"
            echo "| march | \`${{ inputs.march }}\` |"
            echo "| cflags | \`$cf\` |"
            echo "| hardware patch | \`${{ inputs.hardware_patch }}\` |"
            echo "| OptiScaler patches | \`${{ inputs.optiscaler_patches }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure
        working-directory: proton-experimental/build
        env:
          CFLAGS: ${{ steps.cfg.outputs.cflags }}
          USE_LTO: 0
        run: |
          ../configure.sh \
            --build-name=${{ steps.cfg.outputs.build_name }} \
            --container-engine=docker \
            --enable-ccache
          cat Makefile

      - name: Cache identifier
        id: ccache-id
        working-directory: proton-experimental/build
        run: |
          image=$(make get-steamrt-image | tail -1)
          source=$(git -C .. rev-parse HEAD)
          patches=$(find ../../overlay/valve-experimental -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -d' ' -f1)
          checksum=$(echo "$image $source $patches ${{ steps.cfg.outputs.cflags }}" | sha1sum | cut -d' ' -f1)
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache-restore
        if: ${{ !inputs.dry_run }}
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-proton-experimental-${{ steps.ccache-id.outputs.checksum }}-${{ github.run_id }}
          restore-keys: |
            ccache-proton-experimental-${{ steps.ccache-id.outputs.checksum }}

      - name: Build and package
        if: ${{ !inputs.dry_run }}
        working-directory: proton-experimental/build
        run: |
          make redist
          mv redist "${{ steps.cfg.outputs.build_name }}"
          tar -cJf "${{ steps.cfg.outputs.build_name }}.tar.xz" "${{ steps.cfg.outputs.build_name }}"
          sha512sum "${{ steps.cfg.outputs.build_name }}.tar.xz" > "${{ steps.cfg.outputs.build_name }}.sha512sum"

      - name: Save ccache
        if: ${{ !inputs.dry_run && always() }}
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload build
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.cfg.outputs.build_name }}
          path: |
            proton-experimental/build/${{ steps.cfg.outputs.build_name }}.tar.xz
            proton-experimental/build/${{ steps.cfg.outputs.build_name }}.sha512sum
          retention-days: 30
          if-no-files-found: error
